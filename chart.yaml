title: "Workflow Execution Dashboard"

datasets:
  - name: "workflow_data.csv"
    label: "November 2025 Workflows"
    csv_file: "workflow_data.csv"
    x_axis:
      column: "timestamp"
      label: "Execution Time"
    y_axis:
      column: "duration"
      label: "Duration (seconds)"
    filters:
      - column: "user_name"
        label: "Users"
        icon: "👥"
      - column: "team"
        label: "Teams"
        icon: "🏢"
      - column: "title"
        label: "Titles"
        icon: "💼"
      - column: "location"
        label: "Locations"
        icon: "📍"

  - name: "workflow_data2.csv"
    label: "December 2025 Workflows"
    csv_file: "workflow_data2.csv"
    x_axis:
      column: "timestamp"
      label: "Execution Time"
    y_axis:
      column: "duration"
      label: "Duration (seconds)"
    filters:
      - column: "user_name"
        label: "Users"
        icon: "👥"
      - column: "team"
        label: "Teams"
        icon: "🏢"
      - column: "title"
        label: "Titles"
        icon: "💼"
      - column: "location"
        label: "Locations"
        icon: "📍"
